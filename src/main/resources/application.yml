spring:
  application:
    name: eh-email-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://10.201.8.192:8888}"
  cloud:
    bus:
      enabled: true

    stream:
      kafka:
        binder:
          producer-properties:
            key.serializer: org.apache.kafka.common.serialization.StringSerializer
            value.serializer: org.apache.kafka.common.serialization.ByteArraySerializer

management:
  endpoints:
    web:
      exposure:
        include: prometheus,busrefresh,refresh,health,info,loggers,env

  endpoint:
    prometheus:
      access: read_only

    loggers:
      access: read_only
